name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-quality:
    name: Python, INO, and header quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install black==24.10.0
      - name: Format Python (auto-fix and commit if needed)
        run: python -m black CYDDeckEditor.py
      - name: Verify Python formatting
        run: python -m black --check CYDDeckEditor.py
      - name: Check Python, INO, and header sources
        run: |
          python -m py_compile CYDDeckEditor.py
          python - <<'PY'
          import ast
          from pathlib import Path

          editor = Path("CYDDeckEditor.py")
          tree = ast.parse(editor.read_text(encoding="utf-8"))
          if "Editor" not in {node.name for node in tree.body if isinstance(node, ast.ClassDef)}:
              raise SystemExit("Editor class is missing")

          sources = [path for path in Path(".").rglob("*") if path.suffix.lower() in {".ino", ".h"}]
          if not any(path.name == "CYDDeck.ino" for path in sources):
              raise SystemExit("CYDDeck/CYDDeck.ino is missing")
          for path in sources:
              source = path.read_text(encoding="utf-8", errors="replace")
              if not source.strip():
                  raise SystemExit(f"{path} is empty")
          print("Python, INO, and header source checks passed.")
          PY

  firmware-build:
    name: ESP32 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "TFT_eSPI@2.5.43" "XPT2046_Touchscreen@1.4" "NimBLE-Arduino@2.5.0" "ArduinoJson@7.4.3"
      - name: Use the project's TFT header configuration
        run: cp "Setup(LOOK AT ME)/User_Setup_Select.h" "$HOME/Arduino/libraries/TFT_eSPI/User_Setup_Select.h"
      - name: Compile CYD firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 CYDDeck
