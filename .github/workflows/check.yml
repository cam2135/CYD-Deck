name: Code Quality

on:
  push:
  pull_request:

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install black
      - name: Verify Python formatting
        run: python -m black --check CYDDeckEditor.py
      - name: Check syntax and maintainability
        run: |
          python -m py_compile CYDDeckEditor.py
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("CYDDeckEditor.py").read_text(encoding="utf-8"))
          if "Editor" not in {node.name for node in tree.body if isinstance(node, ast.ClassDef)}:
              raise SystemExit("Editor class is missing")
          print("Syntax and structural checks passed.")
          PY
