name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-quality:
    name: Python, INO, and header quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install black
      - name: Verify Python formatting
        run: python -m black --check CYDDeckEditor.py
      - name: Check Python, INO, and header sources
        run: python scripts/check_quality.py

  firmware-build:
    name: ESP32 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install TFT_eSPI XPT2046_Touchscreen NimBLE-Arduino ArduinoJson
      - name: Use the project's TFT header configuration
        run: cp "Setup(LOOK AT ME)/User_Setup_Select.h" "$HOME/Arduino/libraries/TFT_eSPI/User_Setup_Select.h"
      - name: Compile CYD firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 CYDDeck
